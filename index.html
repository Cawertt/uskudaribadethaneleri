<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Üsküdar İbadethaneleri - Tarihi Keşif</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@100..900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    
    <link rel="stylesheet" href="styles.css">
</head>
<body class="light-theme">
    <div class="app-container">
        <button id="sidebarToggle" class="sidebar-toggle" title="Menü">
            <i class="fas fa-bars"></i>
        </button>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <aside class="sidebar">
            <header>
                <div class="header-top">
                    <h1>Üsküdar Kültür Envanteri</h1>
                </div>
                <p>İbadethaneler ve İnanç Durakları</p>
            </header>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="İbadethane ara...">
            </div>
            
            <nav class="filters">
                <button class="filter-btn active" data-type="all">Hepsi</button>
                <button class="filter-btn" data-religion="islam">İslam</button>
                <button class="filter-btn" data-religion="hristiyanlik">Hristiyanlık</button>
                <button class="filter-btn" data-religion="yahudilik">Yahudilik</button>
                <button class="filter-btn" data-type="turbe">Türbeler</button>
            </nav>
            
            <div class="places-list" id="placesList">
                <!-- Data will be injected here -->
            </div>
        </aside>
        
        <main class="map-wrapper">
            <div id="map"></div>
            <div class="map-controls">
                <button id="satelliteToggle" class="map-control-btn" title="Uydu Görünümü">
                    <i class="fas fa-satellite"></i>
                </button>
                <button id="themeToggle" class="map-control-btn" title="Karanlık/Aydınlık Mod">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </main>
    </div>

    <footer class="app-footer">
        <p>Made By Sezer CIRIT</p>
    </footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
